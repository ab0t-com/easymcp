# GitHub API MCP Server Configuration
# This example shows how to create an MCP server for the GitHub REST API

version: "1.0"

server:
  name: "GitHub API MCP Server"
  description: "MCP server providing access to GitHub REST API"
  version: "1.0.0"

openapi:
  # GitHub's OpenAPI specification
  url: "https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json"
  base_url: "https://api.github.com"

api_auth:
  type: "bearer"
  token_env: "GITHUB_TOKEN"  # Set via: export GITHUB_TOKEN="example-token-value"

mcp_auth:
  enabled: false  # Disable for local development
  # For production, enable JWT or OAuth:
  # enabled: true
  # type: "jwt"
  # jwks_uri: "https://your-auth.com/.well-known/jwks.json"
  # issuer: "https://your-auth.com"
  # audience: "github-mcp-server"

routing:
  strategy: "semantic"  # GET → Resources, POST/PUT/DELETE → Tools

discoverability:
  enabled: true
  enhance_descriptions: true
  include_examples: true
  include_constraints: true

transport:
  type: "http"
  host: "0.0.0.0"
  port: 8000

logging:
  level: "INFO"
  format: "json"

tags:
  - "github"
  - "version-control"
  - "api"
